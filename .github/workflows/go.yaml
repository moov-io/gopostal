name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool pkg-config git

    - name: Cache libpostal data
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/libpostal-data
        key: libpostal-data-${{ runner.os }}-v1.1.4
        restore-keys: |
          libpostal-data-${{ runner.os }}-

    - name: Build and install libpostal
      run: |
        set -e
        git clone -b v1.1.4 --depth 1 https://github.com/openvenues/libpostal.git /tmp/libpostal
        cd /tmp/libpostal
        ./bootstrap.sh
        ./configure --prefix=$HOME/libpostal --datadir=$HOME/libpostal-data
        make -j$(nproc)
        make install
        # Download (or verify) data into the configured datadir. This is a no-op on cache hit
        # because the version files will match. The target must include the /libpostal suffix
        # that configure appends to --datadir.
        $HOME/libpostal/bin/libpostal_data download all $HOME/libpostal-data/libpostal

    - name: Configure environment
      run: |
        echo "PKG_CONFIG_PATH=$HOME/libpostal/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$HOME/libpostal/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
        echo "LIBRARY_PATH=$HOME/libpostal/lib" >> $GITHUB_ENV
        echo "LIBPOSTAL_DATA_DIR=$HOME/libpostal-data/libpostal" >> $GITHUB_ENV

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
      id: go

    - name: Tests
      run: go test ./...
