# Use https://app.stepsecurity.io/ to improve workflow security
name: CodeQL Analysis

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '35 10 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  CodeQL-Build:
    if: ${{ !github.event.repository.private && !github.event.repository.archived }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config git

      - name: Build and install libpostal
        run: |
          set -e
          git clone -b v1.1.4 --depth 1 https://github.com/openvenues/libpostal.git /tmp/libpostal
          cd /tmp/libpostal
          ./bootstrap.sh
          ./configure --prefix=$HOME/libpostal --datadir=$HOME/libpostal-data --disable-data-download
          make -j$(nproc)
          make install
          echo "PKG_CONFIG_PATH=$HOME/libpostal/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/libpostal/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$HOME/libpostal/lib" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-I$HOME/libpostal/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$HOME/libpostal/lib" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
